<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat - Travel.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-plane"></i> Travel<span class="text-warning">.com</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fas fa-search"></i> Cari Tiket</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="favorite.html"><i class="fas fa-heart"></i> Favorit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="history.html"><i class="fas fa-history"></i> Riwayat</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="account.html"><i class="fas fa-user"></i> Akun</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container text-center">
            <h2>Riwayat Pemesanan</h2>
            <p>Lihat semua pemesanan tiket Anda</p>
        </div>
    </section>

    <section class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="fas fa-history"></i> Riwayat Penerbangan</h3>
            <div class="sort-options">
                <select class="form-select form-select-sm" id="filterHistory">
                    <option value="all">Semua</option>
                    <option value="upcoming">Akan Datang</option>
                    <option value="completed">Selesai</option>
                    <option value="cancelled">Dibatalkan</option>
                </select>
            </div>
        </div>
        
        <div id="historyContainer">
            <div class="alert alert-info text-center" id="noHistory">
                <i class="fas fa-history fa-3x mb-3 text-muted"></i>
                <h4>Belum ada riwayat</h4>
                <p>Anda belum melakukan pemesanan tiket</p>
                <a href="index.html" class="btn btn-primary mt-3">
                    <i class="fas fa-search"></i> Pesan Tiket Pertama
                </a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="text-center mb-0">&copy; 2024 Travel.com. Hak Cipta Dilindungi.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
